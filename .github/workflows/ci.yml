name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Smoke-test the `pw-sapui5 init` scaffolding CLI
        # Packs the library the way npm consumers actually receive it (not a symlinked/local
        # dependency, which resolves peer packages differently) and type-checks the generated
        # project against whatever TypeScript version is current at the time - this is exactly
        # how a real regression (TypeScript 7 removing "moduleResolution": "node") was caught
        # during development.
        run: |
          npm pack
          mkdir -p /tmp/pw-sapui5-init-check
          node dist/generator/cli.js init --dir /tmp/pw-sapui5-init-check --base-url "https://example.com/"
          cd /tmp/pw-sapui5-init-check
          npm install --no-save "$GITHUB_WORKSPACE"/playwright-sapui5-*.tgz @playwright/test dotenv typescript @types/node
          npx tsc --noEmit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run example tests
        run: npm test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
