# Every 30 minutes (the SVM retry cadence): plan from the run store, and only when something is due
# install browsers, advance Black Duck steps, run the SVM checks and notify finished runs.
name: svm-e2e-tick
on:
  schedule: [{ cron: '5,35 * * * *' }]
  workflow_dispatch:
concurrency: svm-e2e-store # the file store has no row locking
permissions:
  contents: write # saves the run store to the svm-e2e-state branch
jobs:
  tick:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: svm-e2e } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: svm-e2e/package-lock.json }
      - run: npm ci
      - run: scripts/state.sh pull
      # Reads only the run store, no tokens. Most ticks find nothing due and stop here (~20 s).
      - id: plan
        run: npm run --silent plan
      - if: steps.plan.outputs.svm == 'true'
        uses: actions/cache@v4
        id: browsers
        with:
          {
            path: ~/.cache/ms-playwright,
            key: "playwright-${{ runner.os }}-${{ hashFiles('svm-e2e/package-lock.json') }}",
          }
      - if: steps.plan.outputs.svm == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.plan.outputs.work == 'true'
        run: npm run tick:all
        env:
          BD_URL: ${{ vars.BD_URL }}
          SVM_API_URL: ${{ vars.SVM_API_URL }}
          SVM_UI_URL: ${{ vars.SVM_UI_URL }}
          BD_API_TOKEN: ${{ secrets.BD_API_TOKEN }}
          SVM_API_TOKEN: ${{ secrets.SVM_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - run: scripts/state.sh push
        if: always() && steps.plan.outputs.work == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.plan.outputs.svm == 'true'
        with: { name: svm-e2e-reports, path: "svm-e2e/results\nsvm-e2e/playwright-report" }
