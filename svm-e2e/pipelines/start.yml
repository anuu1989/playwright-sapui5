# Daily or on demand: starts one run (uploads the add SBOM and saves the run as ADDED).
name: svm-e2e-start
on:
  schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:
concurrency: svm-e2e-store
permissions:
  contents: write # saves the run store to the svm-e2e-state branch
jobs:
  start:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: svm-e2e } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: svm-e2e/package-lock.json }
      - run: npm ci
      - run: scripts/state.sh pull
      - run: npm run start-run
        env:
          BD_URL: ${{ vars.BD_URL }}
          BD_API_TOKEN: ${{ secrets.BD_API_TOKEN }}
      - run: scripts/state.sh push
        if: always()
